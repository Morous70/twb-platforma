# Sestavení aplikace TWB přehrávač pro Android TV.
# Po každém nahrání změn do větve main se sestaví podepsané APK a vloží se do vydání (Releases) „v<verze>“.
# Výsledek a konec výpisu sestavení se uloží do větve ci-log (soubor status.txt), aby ho šlo přečíst i bez přihlášení do GitHubu.
name: Sestavení APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verze
        id: ver
        run: echo "version=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Sestavení
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "twb-prehravac-${{ steps.ver.outputs.version }}.apk"

      - name: Vydání (Releases)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          APK="twb-prehravac-${{ steps.ver.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "TWB přehrávač ${{ steps.ver.outputs.version }}" --notes "Aplikace pro Android TV. Stáhněte soubor $APK a nainstalujte ho do televize."
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: twb-prehravac-${{ steps.ver.outputs.version }}
          path: twb-prehravac-*.apk

      - name: Výsledek do větve ci-log
        if: always()
        run: |
          STATUS="${{ steps.build.outcome }}"
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q && git checkout -q -b ci-log
          {
            echo "status: $STATUS"
            echo "commit: ${{ github.sha }}"
            echo "version: ${{ steps.ver.outputs.version }}"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "---"
            tail -n 200 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || echo "(bez výpisu)"
          } > status.txt
          git add status.txt
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Sestavení ${{ github.sha }}: $STATUS"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
