<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>TWB přehrávač</title>
<link rel="icon" href="icons/icon-32.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.idle { cursor: none; }
  #stage { position: fixed; inset: 0; }
  #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .45s ease; }
  #stage > .on { opacity: 1; }
  #stage canvas { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); width: auto; height: auto; max-width: 100%; max-height: 100%; }
  #stage .text { display: grid; place-items: center; background: #111; }
  #stage .html { background: #000; }
  #stage .html iframe { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; border: 0; background: #fff; pointer-events: none; }
  #stage .text div { white-space: pre-wrap; width: max-content; text-align: center; font-weight: 700; line-height: 1.2; max-width: 90vw; overflow-wrap: anywhere; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #ccc; font-size: 18px; }
  #msg b { color: #fff; display: block; font-size: 22px; margin-bottom: 6px; }
  #msg button { margin-top: 16px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 22px 16px; background: linear-gradient(transparent, rgba(0,0,0,.78)); display: flex; align-items: center; gap: 12px; transition: opacity .3s; }
  body.idle #bar { opacity: 0; pointer-events: none; }
  #bar .t { flex: 1; min-width: 0; }
  #bar .t span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar small { opacity: .7; }
  .pb { height: 3px; background: rgba(255,255,255,.25); border-radius: 2px; margin-top: 7px; }
  .pb i { display: block; height: 100%; width: 0; background: #fff; border-radius: 2px; }
  button.ib { background: rgba(0,0,0,.35); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 7px 11px; font: inherit; font-weight: 600; cursor: pointer; }
  button.ib:hover { background: rgba(255,255,255,.15); }
  #sound { position: fixed; top: 16px; right: 16px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="msg" hidden></div>
  <button class="ib" id="sound" hidden title="Zapnout zvuk">🔇 Zapnout zvuk</button>
  <div id="bar">
    <div class="t"><span id="name">–</span><small id="info"></small><div class="pb"><i id="prog"></i></div></div>
    <button class="ib" id="refresh" title="Obnovit seznam (R)">⟳ Obnovit</button>
    <button class="ib" id="pause" title="Pozastavit / pokračovat (mezerník)">❚❚</button>
    <button class="ib" id="next" title="Další (→)">⏭</button>
    <button class="ib" id="fs" title="Celá obrazovka (F, dvojklik)">⛶</button>
  </div>
  <script src="lib/pdf.min.js"></script>
  <script type="module" src="player.js"></script>
</body>
</html>
