<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>TWB Plánovač médií – přehrávač</title>
<link rel="stylesheet" href="style.css">
<style>
  body { width: 340px; padding: 14px; }
  .prev { margin: 12px 0 10px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #000; display: grid; place-items: center; }
  .prev img, .prev video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .prev .ph { color: #bbb; font-size: 12.5px; padding: 0 14px; text-align: center; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .meta b { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btns .btn { flex: 1; }
  .links { display: flex; justify-content: space-between; margin-top: 12px; }
  .alert { margin-top: 10px; }
</style>
</head>
<body>
  <div class="head"><img src="icons/icon.svg" alt=""><div>TWB Plánovač médií<small id="ver">Přehrávač pro Chrome</small></div></div>
  <div id="alert" class="alert err" hidden></div>
  <div id="warn" class="alert warn" hidden></div>
  <div class="prev" id="prev"><div class="ph" id="prevTxt">Načítám…</div></div>
  <div class="meta" id="meta"></div>
  <div class="btns">
    <button class="btn" id="refresh">⟳ Obnovit</button>
    <button class="btn pri" id="play">⛶ Přehrávat na celé obrazovce</button>
  </div>
  <div class="links"><button class="lnk" id="opts">Nastavení pluginu</button><a class="lnk" id="app" href="#" target="_blank" rel="noopener">Otevřít Plánovač</a></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
