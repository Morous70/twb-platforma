<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline – TWB Plánovač médií</title><meta name="theme-color" content="#d2502c">
<style>
  :root { color-scheme: light dark; --bg: #f4f2ee; --panel: #fff; --ink: #1d1c1a; --muted: #6f6b64; }

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  .box { background: var(--panel); border-radius: 14px; padding: 28px; max-width: 360px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  svg { display: block; margin: 0 auto; }
  h1 { font-size: 20px; margin: 14px 0 6px; } p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
  button { background: #d2502c; color: #fff; border: 0; border-radius: 9px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
